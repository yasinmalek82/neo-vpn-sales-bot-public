# Owner-run test bundle. All images are verified and loaded by install.sh.
services:
  bot:
    image: ${NEO_BOT_IMAGE:?Run install.sh first}
    pull_policy: never
    env_file: .env
    volumes:
      - app_data:/app/data
      - app_backups:/app/backups
      - ./source/config:/app/config:ro
    ports:
      - "127.0.0.1:8080:8080"
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "scripts/healthcheck.py"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
  db:
    image: ${NEO_DB_IMAGE:?Run install.sh first}
    pull_policy: never
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Run install.sh first}
      POSTGRES_USER: ${POSTGRES_USER:?Run install.sh first}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run install.sh first}
    # Small test host; this is not a production tuning profile.
    command: ["postgres", "-c", "shared_buffers=32MB", "-c", "max_connections=30"]
    volumes:
      - db_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
  caddy:
    image: ${NEO_CADDY_IMAGE:?Run install.sh first}
    pull_policy: never
    environment:
      WEB_PANEL_DOMAIN: ${WEB_PANEL_DOMAIN:?Run install.sh first}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./source/docker/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - bot
    restart: unless-stopped
volumes:
  app_data:
  app_backups:
  db_data:
  caddy_data:
  caddy_config:
